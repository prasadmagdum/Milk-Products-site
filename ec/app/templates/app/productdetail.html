{% extends "app/base.html" %}
{% load static %}

{% block title %}
    Category
{% endblock title %}
{% block main-content %}
    <div class="container">
        <div class="row justify-content-between">
            <div class="img2 col-lg-5 mt-5">
                <img src="{{ product.product_image.url }}" class="image w-100 h-75" alt="Product Image">
            </div>
            <div class="productdetail col-lg-5">
                <h1 style="font-family:Georgia; font-size: 50px;">
                    {{ product.title }}
                </h1>
                <h5>Rs.{{ product.discounted_price }}/-</h5>
                <small class="text-decoration-line-through text-muted fs-5">
                    <del>Rs.{{ product.selling_price }}/-</del>
                </small>
                <br><br>
                <h4>Product Features</h4>
                <ul class="fs-5" style="font-family:Rajdhani;">
                    <li>{{ product.description }}</li>
                </ul>
                 <form action="/add-to-cart" class="d-online">
                      <input type="hidden" name="prod_id" value="{{ product.id }}">
                    <button type="submit" class="btn btn-danger btn-lg m-1">
                        Add to Cart
                    </button>
                 <a href="{% url 'showcart' %}" class="btn btn-warning btn-lg shadow px-5 py-2 ms-2"> Buy Now</a>
                    
               
            </div>
        </div>
    </div>
{% endblock main-content %}
